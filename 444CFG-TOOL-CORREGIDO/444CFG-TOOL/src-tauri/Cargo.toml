[package]
name = "cfg444-tool"
version = "1.0.0"
description = "444CFG TOOL - Windows & FiveM configuration tool"
edition = "2021"

[lib]
name = "cfg444_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
data-encoding = "2"
sha2 = "0.10"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
